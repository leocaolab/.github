name: Latest blog posts

# Pulls the newest posts from the blog's RSS feed into profile/README.md,
# between the BLOG-POST-LIST markers. Runs every 6 hours + on demand.
# NOTE: populates only once blog.leocaolab.com is deployed and /rss.xml is live.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://blog.leocaolab.com/rss.xml"
          readme_path: "./profile/README.md"
          commit_message: "chore: refresh latest blog posts"
          max_post_count: 5
